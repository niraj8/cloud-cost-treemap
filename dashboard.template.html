<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Cost Atlas</title>
  <style>__CSS__</style>
</head>
<body>
  <div id="app">
    <aside>
      <div id="mode" class="mode"></div>
      <nav id="nav" aria-label="Providers, accounts, projects, workspaces, and trends"></nav>
      <div class="aside-foot"><span class="status-dot"></span> Local billing snapshot<p id="snapshot"></p><p>Cloud credentials stay outside this page.</p></div>
    </aside>
    <main>
      <section class="toolbar" aria-label="Filters">
        <label>Billing month<select id="month"></select></label>
        <label>Currency<select id="currency"></select></label>
        <label id="provider-filter">Provider<select id="provider"><option value="all">All providers</option><option value="aws">AWS</option><option value="gcp">GCP</option><option value="claude">Claude</option></select></label>
        <label class="search"><span id="search-caption">Filter services</span><input id="search" type="search" placeholder="Search a service…"></label>
        <button class="button" id="reset">Reset filters</button>
      </section>
      <div id="notice" class="notice"></div>
      <section id="stats" class="stats" aria-label="Cost summary"></section>
      <section class="panel"><div class="panel-head"><div><h2 id="chart-title"></h2><p id="chart-caption"></p></div><span class="tag" id="chart-tag"></span></div><div id="chart"></div></section>
      <section class="panel detail"><div class="panel-head"><div><h2 id="table-title">Service breakdown</h2><p id="table-caption"></p></div></div><div class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
      <footer id="footnote"></footer>
    </main>
  </div>
  <script id="data" type="application/json">__DATA__</script>
  <script>__JS__</script>
</body>
</html>
